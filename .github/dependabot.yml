# Version updates for GitHub Actions only. Go modules get security updates
# from the repository's Dependabot security updates setting instead, so the
# many go.mod files here do not each open routine bump PRs.
#
# bench/reproducible/results/ holds frozen sources that reproduce published
# measurements, so its dependencies stay pinned: the ignore rules below also
# stop security updates there.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /bench/reproducible/results/2026-09-21-v1.8.0-typed-binding/reproduction/sources/actix
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: gomod
    directories:
      - /bench/reproducible/results/2026-09-21-v1.8.0-typed-binding/reproduction/sources/fiber
      - /bench/reproducible/results/2026-09-21-v1.8.0-typed-binding/reproduction/sources/kruda
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

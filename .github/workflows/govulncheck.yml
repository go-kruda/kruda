# Weekly stdlib/dependency vulnerability scan for all released modules.
# The June 2026 Go floor bump (GO-2026-5037/5039) was a manual scramble —
# this catches the next one automatically.

name: govulncheck

on:
  schedule:
    - cron: '0 21 * * 0' # Sunday 21:00 UTC = Monday 04:00 Asia/Bangkok
  workflow_dispatch:
  pull_request:
    paths:
      - '**/go.mod'
      - '**/go.sum'
      - 'scripts/govulncheck-modules.sh'
      - '.github/workflows/govulncheck.yml'

permissions:
  contents: read

jobs:
  scan:
    name: Scan released modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'

      - name: Scan published dependency graphs
        run: ./scripts/govulncheck-modules.sh

      - name: Scan candidate core integration
        if: github.event_name == 'pull_request'
        run: ./scripts/govulncheck-modules.sh --local-core
